name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 0.1.1）；留空则使用仓库默认'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win
            artifacts: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest*.yml
          - os: macos-latest
            builder_args: --mac
            artifacts: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.pkg
              apps/desktop/release/*.zip
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 测试
        run: npm test

      - name: 构建 Web
        run: npm run build -w @ac-ledger/web

      - name: 解析发布版本（来自 tag 或手动输入）
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ver="${{ github.event.inputs.version }}"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: 打包桌面版（${{ matrix.os }}）
        working-directory: apps/desktop
        env:
          AC_LEDGER_VERSION: ${{ steps.version.outputs.version }}
          # 无签名证书环境跳过 macOS 代码签名（未签名产物本地可运行，Gatekeeper 需右键打开）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node scripts/prepare-app.cjs
          npx electron-builder ${{ matrix.builder_args }}

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          draft: true
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: false
